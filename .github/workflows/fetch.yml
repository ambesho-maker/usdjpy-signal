name: fetch-usdjpy
on:
  schedule:
    - cron: "3-58/5 * * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fetch-usdjpy
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch USD/JPY 5min
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python fetch.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "update $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
