<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>USD/JPY</title>
<style>
:root{--bg:#fff;--fg:#111;--card:#f2f2f7;--mut:#6b6b70}
@media(prefers-color-scheme:dark){:root{--bg:#000;--fg:#f2f2f7;--card:#1c1c1e;--mut:#98989f}}
body{margin:0;padding:16px;font-family:-apple-system,sans-serif;background:var(--bg);color:var(--fg)}
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px}
.rate{font-size:44px;font-weight:700}.mut{color:var(--mut);font-size:13px}
.sig{font-size:28px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;text-align:right}
th:first-child,td:first-child{text-align:left}
</style></head><body>
<div class="card"><div class="mut">USD/JPY（5分足・確定値）</div>
<div class="rate" id="rate">--</div><div class="mut" id="time">読み込み中…</div></div>
<div class="card"><div class="mut">シグナル</div><div class="sig" id="sig">WAIT</div>
<div class="mut" id="note"></div></div>
<div class="card"><table><thead><tr><th>時刻(JST)</th><th>始値</th><th>高値</th><th>安値</th><th>終値</th></tr></thead>
<tbody id="rows"></tbody></table></div>
<script>
const f=n=>Number(n).toFixed(3);
const jst=s=>new Date(s).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
const user=location.hostname.split('.')[0], repo=location.pathname.split('/')[1];
const URL_=`https://raw.githubusercontent.com/${user}/${repo}/main/data/latest.json`;
async function load(){
 try{const d=await (await fetch(URL_+'?t='+Date.now())).json();
 if(!d.candles.length){time.textContent='データなし';return}
 const c=d.candles[0];
 rate.textContent=f(c.close);time.textContent='足の開始: '+jst(c.datetime);
 sig.textContent=d.signal;note.textContent=d.signal_note;
 rows.innerHTML=d.candles.map(x=>`<tr><td>${jst(x.datetime)}</td><td>${f(x.open)}</td><td>${f(x.high)}</td><td>${f(x.low)}</td><td>${f(x.close)}</td></tr>`).join('');
 }catch(e){time.textContent='取得エラー（データ未生成の可能性）'}
}
load();setInterval(load,60000);
</script></body></html>
